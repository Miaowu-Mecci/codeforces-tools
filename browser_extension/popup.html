<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CF Submit</title>
<link rel="stylesheet" href="popup.css">
<form id="pairing">
  <label for="port">本机连接端口</label>
  <input id="port" type="number" required min="1" max="65535" step="1" value="12450">
  <div id="pairing-code">
    <label for="code">服务器配对码</label>
    <input id="code" type="password" required autocomplete="off" spellcheck="false"
           minlength="43" maxlength="43" pattern="[A-Za-z0-9_\-]{43}">
  </div>
  <button id="save" type="submit">连接</button>
</form>
<div id="controls" hidden>
  <button id="check" type="button">立即检查</button>
  <button id="disconnect" type="button">断开</button>
</div>
<p id="status" role="status"></p>
<script src="popup.js" type="module"></script>
</html>
